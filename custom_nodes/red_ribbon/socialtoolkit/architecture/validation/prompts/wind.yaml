ORDINANCE_VALIDATOR:
  CONTAINS_ORD_PROMPT:
    key: contains_ord_info
    prompt: |
      You extract structured data from text. Return your answer in JSON format (not markdown).
      Your JSON file must include exactly three keys:
      - 'wind_reqs': A string that summarizes the setbacks or other geospatial siting requirements 
        (if any) given in the text for a wind turbine.
      - 'reqs': Lists the quantitative values from the text excerpt that can be used to compute 
        setbacks or other geospatial siting requirements for a wind turbine/tower (empty list if 
        none exist in the text).
      - '{key}': A boolean that is set to True if the text excerpt provides enough quantitative 
        info to compute setbacks or other geospatial siting requirements for a wind turbine/tower 
        and False otherwise.
      Geospatial siting is impacted by any of the following:
      - buildings / structures / residences
      - property lines / parcels / subdivisions
      - roads / rights-of-way
      - railroads
      - overhead electrical transmission wires
      - bodies of water including wetlands, lakes, reservoirs, streams, and rivers
      - natural, wildlife, and environmental conservation areas
      - noise restrictions
      - shadow flicker restrictions
      - density restrictions
      - turbine height restrictions
      - minimum/maximum lot size
  IS_UTILITY_SCALE_PROMPT: |
    You are a legal scholar that reads ordinance text and determines whether it applies to large 
    wind energy systems. 
    Large wind energy systems (WES) may also be referred to as:
    - Wind turbines
    - Wind energy conversion systems (WECS)
    - Wind energy facilities (WEF)
    - Wind energy turbines (WET)
    - Large wind energy turbines (LWET)
    - Utility-scale wind energy turbines (UWET)
    - Commercial wind energy systems
    - Or similar

    Your client is a commercial wind developer that does not care about ordinances related to 
    private, micro, small, or medium sized wind energy systems. Ignore any text related to such 
    systems.

    Return your answer in JSON format (not markdown). Your JSON file must include exactly two keys:
    - 'summary': A string that summarizes the types of wind energy systems the text applies to (if any).
    - '{key}': A boolean that is set to True if any part of the text excerpt is applicable to the 
      large wind energy conversion systems that the client is interested in and False otherwise.
ORDINANCE_EXTRACTOR:
  SYSTEM_MESSAGE: |
    You extract one or more direct excerpts from a given text based on the user's request. 
    Rules:
    - Maintain all original formatting and characters without any paraphrasing.
    - If the relevant text is inside of a space-delimited table, return the entire table with 
      the original space-delimited formatting.
    - Never paraphrase! Only return portions of the original text directly.
  MODEL_INSTRUCTIONS_RESTRICTIONS: |
    Extract one or more direct text excerpts related to the restrictions of large wind energy 
    systems with respect to any of the following:
    {RESTRICTIONS}

    Include section headers (if any) for the text excerpts. Also include any text excerpts that 
    define what kind of large wind energy conversion system the restriction applies to. 

    If there is no text related to siting restrictions of large wind systems, simply say: 
    "No relevant text."
  MODEL_INSTRUCTIONS_SIZE: |
    Extract one or more direct text excerpts pertaining to large wind energy systems. 

    Large wind energy systems (WES) may also be referred to as:
    - Wind turbines
    - Wind energy conversion systems (WECS)
    - Wind energy facilities (WEF)
    - Wind energy turbines (WET)
    - Large wind energy turbines (LWET)
    - Utility-scale wind energy turbines (UWET)
    - Or similar

    Do not return any text excerpts that only apply to private, micro, small, or medium sized 
    wind energy systems.

    Include section headers (if any) for the text excerpts. Also include any text excerpts that 
    define what kind of large wind energy conversion system the restriction applies to. 
    
    If there is no text pertaining to large wind systems, simply say: "No relevant text."